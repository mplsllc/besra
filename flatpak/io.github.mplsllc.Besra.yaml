app-id: io.github.mplsllc.Besra
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: besra
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-config/besra:create

modules:
  - name: besra
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: dir
        path: ..
        skip:
          - build
          - .git
          - .private
